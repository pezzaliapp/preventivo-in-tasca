name: Aggiorna prezzo gasolio (MIMIT) — copia per Preventivo in tasca
# Copia del workflow di calcolo-trasporti (quello originale resta dov'è e continua a funzionare):
# qui aggiorna data/trasporti/gasolio.json di Preventivo in tasca.

# Il MIMIT pubblica il prezzo del giorno dalle 8:30 (ora italiana).
# Il controllo parte più volte al giorno: se una volta GitHub è in ritardo o il sito non risponde,
# ci pensa l'esecuzione successiva. Alla sera una verifica finale: se il dato non è di oggi
# l'esecuzione diventa rossa e GitHub manda un'e-mail al proprietario del repository.
on:
  schedule:
    - cron: "20 7,9,11,13,15 * * *"   # 9:20, 11:20, 13:20, 15:20, 17:20 ora legale (un'ora prima con l'ora solare)
    - cron: "40 17 * * *"             # verifica finale: 19:40 ora legale / 18:40 ora solare
  push:
    branches: [main]                  # dopo ogni pubblicazione ricontrolla subito
    paths-ignore: ["data/trasporti/gasolio.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gasolio
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggi prezzo MIMIT
        id: leggi
        run: |
          if [ "${{ github.event.schedule }}" = "40 17 * * *" ]; then
            python scripts/aggiorna_gasolio.py --verifica
          else
            python scripts/aggiorna_gasolio.py
          fi
      - name: Salva se cambiato
        if: always()
        run: |
          if git diff --quiet data/trasporti/gasolio.json; then
            echo "Nessuna modifica da salvare."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
            git add data/trasporti/gasolio.json
            git commit -m "Prezzo gasolio MIMIT aggiornato"
            git pull --rebase origin main
            git push
          fi
