name: Pubblica l'app su GitHub Pages
# Sul sito vanno SOLO i file dell'app (elenco qui sotto). Documenti, test, script, prompt e
# file di sviluppo restano nella repository ma non vengono pubblicati come pagine.
# Requisito una tantum: Settings › Pages › Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:                        # il prezzo del gasolio aggiornato arriva subito sul sito
    workflows: ["Aggiorna prezzo gasolio (MIMIT) — copia per Preventivo in tasca"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagine
  cancel-in-progress: false

jobs:
  pubblica:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test (se uno fallisce non si pubblica)
        run: node --test tests/
      - name: Prepara i file dell'app
        run: |
          mkdir _site
          cp -R index.html sw.js versione.json manifest.webmanifest LICENSE css js data fonts icons lib strumenti _site/
          # controllo di sicurezza: nessun PDF tranne i documenti BCC pubblici
          if find _site -iname '*.pdf' ! -path '_site/data/noleggio/documenti/*' | grep -q .; then
            echo "Trovato un PDF che non deve essere pubblicato"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pubblica
        uses: actions/deploy-pages@v4
